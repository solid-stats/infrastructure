apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant
  namespace: solidstats-memory
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: solidstats-memory
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: solidstats-memory
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: solidstats-memory
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: solidstats-memory
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: solidstats-memory
spec:
  serviceName: qdrant
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: solidstats-memory
    spec:
      serviceAccountName: qdrant
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qdrant
          image: ghcr.io/qdrant/qdrant/qdrant:v1.19.0-unprivileged@sha256:18a245d16eb663d4f6ad054123371243248d8256a8067f352cd6e88d512fee0b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-runtime
                  key: QDRANT_API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: MEMORY_OPERATOR_MEASURED_QDRANT_PVC_SIZE
