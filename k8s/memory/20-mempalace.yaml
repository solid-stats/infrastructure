apiVersion: v1
kind: ServiceAccount
metadata:
  name: mempalace
  namespace: solidstats-memory
  labels:
    app.kubernetes.io/name: mempalace
    app.kubernetes.io/part-of: solidstats-memory
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mempalace-data
  namespace: solidstats-memory
  labels:
    app.kubernetes.io/name: mempalace
    app.kubernetes.io/part-of: solidstats-memory
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: MEMORY_OPERATOR_MEASURED_MEMPALACE_PVC_SIZE
---
apiVersion: v1
kind: Service
metadata:
  name: mempalace
  namespace: solidstats-memory
  labels:
    app.kubernetes.io/name: mempalace
    app.kubernetes.io/part-of: solidstats-memory
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mempalace
  ports:
    - name: http-mcp
      port: 8765
      targetPort: http-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mempalace
  namespace: solidstats-memory
  labels:
    app.kubernetes.io/name: mempalace
    app.kubernetes.io/part-of: solidstats-memory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mempalace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mempalace
        app.kubernetes.io/part-of: solidstats-memory
    spec:
      serviceAccountName: mempalace
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: runtime-bootstrap
          image: MEMORY_OPERATOR_SUPPLIED_MEMPALACE_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/mempalace-bootstrap/bootstrap.py"]
          args: ["offline"]
          env:
            - name: MEMPALACE_PALACE_PATH
              value: /data/palace
            - name: MEMPALACE_EMBEDDING_MODEL
              value: embeddinggemma
            - name: MEMPALACE_EMBEDDING_DEVICE
              value: cpu
            - name: MEMPALACE_QDRANT_URL
              value: http://qdrant:6333
            - name: MEMPALACE_QDRANT_NAMESPACE
              value: SolidStats
            - name: MEMPALACE_QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mempalace-runtime
                  key: MEMPALACE_QDRANT_API_KEY
            - name: SOLIDSTATS_MEMORY_LOGICAL_ALIAS
              valueFrom:
                secretKeyRef:
                  name: mempalace-runtime
                  key: SOLIDSTATS_MEMORY_LOGICAL_ALIAS
            - name: SOLIDSTATS_MEMORY_PHYSICAL_COLLECTION
              valueFrom:
                secretKeyRef:
                  name: mempalace-runtime
                  key: SOLIDSTATS_MEMORY_PHYSICAL_COLLECTION
            - name: SOLIDSTATS_MEMORY_EXPECTED_COUNT
              value: "19534"
            - name: HF_HOME
              value: /data/palace/.cache/huggingface
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mempalace-data
              mountPath: /data
            - name: mempalace-bootstrap
              mountPath: /opt/mempalace-bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: mempalace
          image: MEMORY_OPERATOR_SUPPLIED_MEMPALACE_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["mempalace-mcp"]
          args: ["--palace", "/data/palace", "--backend", "qdrant", "--transport", "http", "--host", "0.0.0.0", "--port", "8765"]
          ports:
            - name: http-mcp
              containerPort: 8765
          env:
            - name: MEMPALACE_BACKEND
              value: qdrant
            - name: MEMPALACE_QDRANT_URL
              value: http://qdrant:6333
            - name: MEMPALACE_QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mempalace-runtime
                  key: MEMPALACE_QDRANT_API_KEY
            - name: MEMPALACE_QDRANT_NAMESPACE
              value: SolidStats
            - name: MEMPALACE_EMBEDDING_MODEL
              value: embeddinggemma
            - name: MEMPALACE_EMBEDDING_DEVICE
              value: cpu
            - name: HF_HOME
              value: /data/palace/.cache/huggingface
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: MEMPALACE_MCP_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mempalace-runtime
                  key: MEMPALACE_MCP_HTTP_TOKEN
            - name: MEMPALACE_DATA_DIR
              value: /data/palace
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-mcp
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-mcp
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mempalace-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mempalace-data
          persistentVolumeClaim:
            claimName: mempalace-data
        - name: mempalace-bootstrap
          configMap:
            name: mempalace-runtime-bootstrap
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
