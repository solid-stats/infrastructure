---
# Source: prometheus/templates/cm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/version: v3.12.0
    helm.sh/chart: prometheus-29.11.0
    app.kubernetes.io/part-of: prometheus
  name: prometheus-server
  namespace: monitoring
data:
  allow-snippet-annotations: "false"
  alerting_rules.yml: |
    groups:
    - name: solidstats-memory-alerts
      rules:
      - alert: SolidStatsMemoryMCPNotReady
        expr: solidstats_memory:mcp_ready:max == 0
        for: 5m
      - alert: SolidStatsMemoryMCPLatencyHigh
        expr: solidstats_memory:mcp_probe_duration_seconds:max > 2
        for: 10m
      - alert: SolidStatsMemoryMCPProbeErrors
        expr: solidstats_memory:mcp_probe_errors:rate5m > 0
        for: 5m
      - alert: SolidStatsMemoryQdrantUnhealthy
        expr: solidstats_memory:qdrant_ready:max == 0
        for: 5m
      - alert: SolidStatsMemoryQdrantCollectionUnavailable
        expr: solidstats_memory:qdrant_collection_healthy:max == 0
        for: 5m
      - alert: SolidStatsMemorySnapshotMissingOrStale
        expr: kube_cronjob_spec_suspend{namespace="solidstats-memory",cronjob="solidstats-memory-backup"}
          == 0 and solidstats_memory:qdrant_snapshot_age_seconds:max > 93600
        for: 15m
      - alert: SolidStatsMemoryPVCCapacityHigh
        expr: solidstats_memory:pvc_capacity_ratio:max > 0.85
        for: 15m
      - alert: SolidStatsMemoryPVCMetricsMissing
        expr: count(kubelet_volume_stats_capacity_bytes{namespace="solidstats-memory",persistentvolumeclaim=~"mempalace-data|qdrant-data-qdrant-0"})
          < 2
        for: 15m
  alerts: |
    {}
  prometheus.yml: |
    global:
      evaluation_interval: 30s
      scrape_interval: 30s
      scrape_timeout: 10s
    scrape_configs:
    - job_name: alloy
      static_configs:
      - targets:
        - alloy.monitoring.svc:12345
    - job_name: kube-state-metrics
      static_configs:
      - targets:
        - kube-state-metrics.monitoring.svc:8080
    - job_name: kubernetes-nodes-cadvisor
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
      - role: node
      metrics_path: /metrics/cadvisor
      relabel_configs:
      - replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        source_labels:
        - __meta_kubernetes_node_name
        target_label: __metrics_path__
      - replacement: kubernetes.default.svc:443
        target_label: __address__
      - source_labels:
        - __meta_kubernetes_node_name
        target_label: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: false
    - job_name: kubernetes-nodes-volume-stats
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - replacement: /api/v1/nodes/$1/proxy/metrics
        source_labels:
        - __meta_kubernetes_node_name
        target_label: __metrics_path__
      - replacement: kubernetes.default.svc:443
        target_label: __address__
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: false
    - job_name: loki
      static_configs:
      - targets:
        - loki.monitoring.svc:3100
    - job_name: node-exporter
      static_configs:
      - targets:
        - node-exporter.monitoring.svc:9100
    - job_name: postgres-exporter
      static_configs:
      - targets:
        - postgres-exporter.monitoring.svc:9187
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
    - job_name: rabbitmq
      static_configs:
      - targets:
        - rabbitmq.solid-stats-staging.svc:15692
    - job_name: solidstats-memory-observer
      static_configs:
      - targets:
        - solidstats-memory-observer.solidstats-memory.svc.cluster.local:9108
    rule_files:
    - /etc/config/recording_rules.yml
    - /etc/config/alerting_rules.yml
    - /etc/config/rules
    - /etc/config/alerts
  recording_rules.yml: |
    groups:
    - name: solidstats-memory-recording
      rules:
      - expr: max(solidstats_memory_mcp_ready{job="solidstats-memory-observer"})
        record: solidstats_memory:mcp_ready:max
      - expr: max(solidstats_memory_mcp_probe_duration_seconds{job="solidstats-memory-observer"})
        record: solidstats_memory:mcp_probe_duration_seconds:max
      - expr: sum(rate(solidstats_memory_mcp_probe_errors_total{job="solidstats-memory-observer"}[5m]))
        record: solidstats_memory:mcp_probe_errors:rate5m
      - expr: max(solidstats_memory_qdrant_ready{job="solidstats-memory-observer"})
        record: solidstats_memory:qdrant_ready:max
      - expr: max(solidstats_memory_qdrant_collection_healthy{job="solidstats-memory-observer"})
        record: solidstats_memory:qdrant_collection_healthy:max
      - expr: time() - max(solidstats_memory_qdrant_latest_snapshot_timestamp_seconds{job="solidstats-memory-observer"})
        record: solidstats_memory:qdrant_snapshot_age_seconds:max
      - expr: max(kubelet_volume_stats_used_bytes{namespace="solidstats-memory",persistentvolumeclaim=~"mempalace-data|qdrant-data-qdrant-0"}
          / kubelet_volume_stats_capacity_bytes{namespace="solidstats-memory",persistentvolumeclaim=~"mempalace-data|qdrant-data-qdrant-0"})
        record: solidstats_memory:pvc_capacity_ratio:max
  rules: |
    {}
---
