{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "allow-unified-to-shared-qdrant",
    "namespace": "solidstats-memory"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app.kubernetes.io/name": "qdrant"
      }
    },
    "policyTypes": [
      "Ingress"
    ],
    "ingress": [
      {
        "from": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "unified-memory"
              }
            },
            "podSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "unified-mempalace"
              }
            }
          },
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "unified-memory"
              }
            },
            "podSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "unified-memory-backup"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 6333
          }
        ]
      }
    ]
  }
}
