name: Deploy SolidStats memory

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: infrastructure-memory-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  K8S_NAMESPACE: solidstats-memory

jobs:
  validate:
    name: Validate isolated boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate source manifests and scripts
        run: |
          set -euo pipefail
          python3 scripts/validate-memory-manifests.py --allow-operator-placeholders
          python3 -m py_compile scripts/render-memory-secrets.py scripts/render-memory-manifests.py scripts/validate-memory-manifests.py
          ! rg -n --glob '*.yaml' --glob '*.yml' '(password|token|secret|api[_-]?key): [^${].+' k8s/memory .github/workflows/deploy-memory.yml

  deploy:
    name: Deploy isolated memory boundary
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - name: Render operator-approved manifests and secrets
        env:
          MEMORY_MEMPALACE_IMAGE: ${{ vars.MEMORY_MEMPALACE_IMAGE }}
          MEMORY_BACKUP_UPLOADER_IMAGE: ${{ vars.MEMORY_BACKUP_UPLOADER_IMAGE }}
          MEMORY_QDRANT_PVC_SIZE: ${{ vars.MEMORY_QDRANT_PVC_SIZE }}
          MEMORY_MEMPALACE_PVC_SIZE: ${{ vars.MEMORY_MEMPALACE_PVC_SIZE }}
          MEMORY_HOST_NGINX_SOURCE_CIDR: ${{ vars.MEMORY_HOST_NGINX_SOURCE_CIDR }}
          MEMORY_BACKUP_S3_CIDR: ${{ vars.MEMORY_BACKUP_S3_CIDR }}
          MEMORY_QDRANT_COLLECTION: ${{ vars.MEMORY_QDRANT_COLLECTION }}
          MEMORY_QDRANT_API_KEY: ${{ secrets.MEMORY_QDRANT_API_KEY }}
          MEMORY_MCP_HTTP_TOKEN: ${{ secrets.MEMORY_MCP_HTTP_TOKEN }}
          MEMORY_BACKUP_S3_ENDPOINT: ${{ secrets.MEMORY_BACKUP_S3_ENDPOINT }}
          MEMORY_BACKUP_S3_BUCKET: ${{ secrets.MEMORY_BACKUP_S3_BUCKET }}
          MEMORY_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.MEMORY_BACKUP_S3_ACCESS_KEY_ID }}
          MEMORY_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.MEMORY_BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/render-memory-manifests.py --output-dir rendered-memory
          python3 scripts/validate-memory-manifests.py --manifest-dir rendered-memory
          python3 scripts/render-memory-secrets.py > rendered-memory/secrets.yaml

      - name: Apply namespace-scoped workload resources
        run: |
          set -euo pipefail
          echo "Operator action required: configure the namespace-scoped CI identity and apply rendered-memory/."
          exit 1
