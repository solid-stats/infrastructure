name: Deploy SolidStats memory

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: infrastructure-memory-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  K8S_NAMESPACE: solidstats-memory
  K8S_CONTEXT_NAME: memory-k3s-staging

jobs:
  validate:
    name: Validate isolated boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate source manifests and scripts
        run: |
          set -euo pipefail
          python3 scripts/validate-memory-manifests.py --allow-operator-placeholders
          python3 scripts/validate-memory-nginx.py --allow-operator-placeholders
          python3 tests/test-memory-runtime-contract.py
          python3 -m py_compile scripts/render-memory-secrets.py scripts/render-memory-manifests.py scripts/validate-memory-manifests.py scripts/validate-memory-nginx.py
          ! rg -n --glob '*.yaml' --glob '*.yml' '(password|token|secret|api[_-]?key): [^${].+' k8s/memory .github/workflows/deploy-memory.yml

  deploy:
    name: Deploy isolated memory boundary
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - name: Open managed SSH tunnel
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_TUNNEL_PID_FILE: ${{ runner.temp }}/solidstats-memory-ssh.pid
        run: bash scripts/ssh-tunnel-up.sh --start-managed
      - name: Setup kubeconfig (memory-ci-deployer, solidstats-memory)
        env:
          K8S_TOKEN: ${{ secrets.K8S_MEMORY_TOKEN }}
          K8S_CA_CERT: ${{ secrets.K8S_CA_CERT }}
          K8S_NAMESPACE: solidstats-memory
          K8S_USER_NAME: memory-ci-deployer
          K8S_CONTEXT_NAME: memory-k3s-staging
        run: bash scripts/kubeconfig-setup.sh
      - name: Prove exact memory identity and RBAC boundary
        run: |
          set -euo pipefail
          identity=$(kubectl --context memory-k3s-staging auth whoami -o jsonpath='{.status.userInfo.username}')
          test "$identity" = 'system:serviceaccount:solidstats-memory:memory-ci-deployer'
          for resource in secrets configmaps services deployments.apps statefulsets.apps cronjobs.batch networkpolicies.networking.k8s.io serviceaccounts; do
            kubectl --context memory-k3s-staging auth can-i create "$resource" -n solidstats-memory | grep -qx yes
          done
          ! kubectl --context memory-k3s-staging auth can-i create namespaces | grep -qx yes
          ! kubectl --context memory-k3s-staging auth can-i create roles.rbac.authorization.k8s.io -n solidstats-memory | grep -qx yes
          ! kubectl --context memory-k3s-staging auth can-i create rolebindings.rbac.authorization.k8s.io -n solidstats-memory | grep -qx yes
          ! kubectl --context memory-k3s-staging auth can-i create deployments.apps -n solid-stats-staging | grep -qx yes
          ! kubectl --context memory-k3s-staging auth can-i create deployments.apps -n monitoring | grep -qx yes
      - name: Render, validate, and dry-run memory resources
        env:
          MEMORY_QDRANT_API_KEY: ${{ secrets.MEMORY_QDRANT_API_KEY }}
          MEMORY_QDRANT_COLLECTION: ${{ secrets.MEMORY_QDRANT_COLLECTION }}
          MEMORY_QDRANT_LOGICAL_ALIAS: ${{ secrets.MEMORY_QDRANT_LOGICAL_ALIAS }}
          MEMORY_MCP_HTTP_TOKEN: ${{ secrets.MEMORY_MCP_HTTP_TOKEN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/render-memory-manifests.py rendered-memory
          python3 scripts/validate-memory-manifests.py --manifest-dir rendered-memory
          umask 077
          python3 scripts/render-memory-secrets.py > rendered-memory/secrets.yaml
          # 00-namespace.yaml and 01-ci-rbac.yaml are operator bootstrap
          # resources and must never enter the CI workload manifest list.
          mapfile -t MEMORY_WORKLOAD_FILES < <(find rendered-memory -maxdepth 1 -name '*.yaml' ! -name '00-namespace.yaml' ! -name '01-ci-rbac.yaml' ! -name 'secrets.yaml' | sort)
          test "${#MEMORY_WORKLOAD_FILES[@]}" -gt 0
          kubectl --context memory-k3s-staging -n solidstats-memory apply --server-side --dry-run=server -f rendered-memory/secrets.yaml
          kubectl --context memory-k3s-staging -n solidstats-memory apply --server-side --dry-run=server "${MEMORY_WORKLOAD_FILES[@]/#/-f}"
          printf '%s\n' "${MEMORY_WORKLOAD_FILES[@]}" > "${RUNNER_TEMP}/memory-workload-files"
      - name: Apply memory secrets and workloads
        run: |
          set -euo pipefail
          mapfile -t MEMORY_WORKLOAD_FILES < "${RUNNER_TEMP}/memory-workload-files"
          kubectl --context memory-k3s-staging -n solidstats-memory apply --server-side -f rendered-memory/secrets.yaml
          kubectl --context memory-k3s-staging -n solidstats-memory apply --server-side "${MEMORY_WORKLOAD_FILES[@]/#/-f}"
      - name: Verify memory rollouts
        run: |
          set -euo pipefail
          kubectl --context memory-k3s-staging -n solidstats-memory rollout status statefulset/qdrant --timeout=300s
          kubectl --context memory-k3s-staging -n solidstats-memory rollout status deployment/mempalace --timeout=300s
          kubectl --context memory-k3s-staging -n solidstats-memory rollout status deployment/solidstats-memory-observer --timeout=180s
      - name: Stop managed SSH tunnel and remove temporary materials
        if: always()
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_TUNNEL_PID_FILE: ${{ runner.temp }}/solidstats-memory-ssh.pid
        run: |
          set -euo pipefail
          bash scripts/ssh-tunnel-up.sh --stop-managed
          rm -rf rendered-memory "${RUNNER_TEMP}/memory-workload-files" "${KUBECONFIG:-$HOME/.kube/config}"
